<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi yiye 🏍️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PANTALLA INICIAL
    ========================== -->

    <section class="inicio" id="inicio">

        <div class="luz-inicio"></div>

        <div class="intro">

            <div class="mini">
                ◈ UN DETALLE ESPECIAL ◈
            </div>

            <div class="linea"></div>

            <h1>
                A TI TE GUSTAN
                <span>LAS MOTOS</span>
            </h1>

            <h2>
                A MÍ ME GUSTAS TÚ
            </h2>

            <button id="entrar" type="button">
                DESCUBRIR
            </button>

        </div>

    </section>


    <!-- =========================
         SEGUNDA PANTALLA
    ========================== -->

    <section class="universo" id="universo">

        <!-- ESTRELLAS -->

        <div class="estrellas estrellas1"></div>
        <div class="estrellas estrellas2"></div>
        <div class="estrellas estrellas3"></div>


        <!-- LUZ CENTRAL -->

        <div class="luz-planeta"></div>


        <!-- TÍTULO -->

        <div class="titulo">

            <p>UNA PEQUEÑA SORPRESA</p>

            <h1>
                FELIZ DÍA DE
                <span>LAS MOTOS</span>
            </h1>

            <small>
                para mi yiye
            </small>

        </div>


        <!-- =========================
             ORBITA
        ========================== -->

        <div class="orbita">

            <!-- PLANETA -->

            <div class="saturno">

                <div class="anillo atras"></div>

                <div class="planeta">

                    <div class="brillo"></div>

                    <span class="crater c1"></span>
                    <span class="crater c2"></span>
                    <span class="crater c3"></span>

                </div>

                <div class="anillo delante"></div>

            </div>


            <!-- =====================
                 MOTOS REALES
            ====================== -->

            <div class="moto moto1">
                <img src="motos/moto1.png" alt="Moto deportiva">
            </div>

            <div class="moto moto2">
                <img src="motos/moto2.png" alt="Moto deportiva">
            </div>

            <div class="moto moto3">
                <img src="motos/moto3.png" alt="Moto deportiva">
            </div>

            <div class="moto moto4">
                <img src="motos/moto4.png" alt="Moto deportiva">
            </div>

            <div class="moto moto5">
                <img src="motos/moto5.png" alt="Moto deportiva">
            </div>

            <div class="moto moto6">
                <img src="motos/moto6.png" alt="Moto deportiva">
            </div>

            <div class="moto moto7">
                <img src="motos/moto7.png" alt="Moto deportiva">
            </div>

            <div class="moto moto8">
                <img src="motos/moto8.png" alt="Moto deportiva">
            </div>

        </div>


        <!-- PALABRAS -->

        <div class="palabra p1">Único</div>
        <div class="palabra p2">Especial</div>
        <div class="palabra p3">Divertido</div>
        <div class="palabra p4">primer AMOR</div>
        <div class="palabra p5">Guapo</div>


        <!-- MENSAJE -->

        <div class="mensaje">

            <p>ENTRE TANTAS MOTOS...</p>

            <h2>
                TÚ SIEMPRE SERÁS
                <span>MI FAVORITA.</span>
            </h2>

            <div class="corazon">
                ♥
            </div>

        </div>


        <!-- VOLVER -->

        <button
            class="repetir"
            id="repetir"
            type="button">
            ↻
        </button>

    </section>


    <script src="script.js"></script>

</body>
</html>
